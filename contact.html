<!DOCTYPE html>
<html>
    <head>
        <title>ติดต่อเรา</title>
        <link rel="stylesheet" href="css/contact.css"
    </head>
    <body>
        <iframe src="menu.html" style="width: 100%; height: 60px border=none;overflow: hidden;" scrolling="no"></iframe>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6501.
        71766375674!2d100.27359014219056!3d13.550299585988075!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.
        1!3m3!1m2!1s0x30e2b86fa7848b8b%3A0x7d9c587713063d7d!2z4Lin4Li04LiX4Lii4Liy4Lil4Lix4Lii4LmA4LiX4LiE4LiZ4Li04LiE4Liq4Lih4Li44LiX4Li
        j4Liq4Liy4LiE4Lij!5e0!3m2!1sth!2sth!4v1786953971877!5m2!1sth!2sth" 
        width="100%" height="320" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

<section class="contact-section">
            <h2>ติดต่อเรา</h2>
        <form action="https://api.web3forms.com/submit" method="POST"
        class="contact-form">
        <input type="hidden" name="access_key" value="01575391-7a95-4f7b-8b6c-0f34e39055e9">
        
        <div class="form-group">
            <label for="name">ชื่อ-นามสกุล:</label>
            <input type="text" id="name" name="name" 
            required placeholder="กรอกชื่อของคุณ">
        </div>

        <div class="from-group">
            <label for="email">อีเมล:</label>
            <input type="email" id="email" name="email"
            required placeholder="กรุณากรอกอีเมล">
        </div>

        <div class="form-group">
            <label for="message">ข้อความ:</label>
            <textarea id="message" name="message" rows="5"
            required placeholder="พิมพ์ข้อความที่นี่"></textarea>
        </div>

        <button type="submit" class="submit-btn">ส่งข้อความ</button>
        </form>
        </section>
        
    
        </body>
</html>
